; Konfigurasi PHP aplikasi
memory_limit = 256M
upload_max_filesize = 5M
post_max_size = 8M
max_execution_time = 60
expose_php = Off
date.timezone = Asia/Jakarta
file_uploads = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Development: validasi timestamp agar perubahan kode langsung terbaca.
; Production: set opcache.validate_timestamps = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
